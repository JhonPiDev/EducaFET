<div class="min-h-screen bg-gradient-to-br from-gray-50 via-white to-gray-100">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">🧮 Crear Evaluación</h1>
        <p class="text-gray-600 mt-1">Configura los detalles y preguntas de tu nueva evaluación</p>
      </div>

      <button
        routerLink="/dashboard/docente"
        class="flex items-center gap-2 px-5 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50 transition font-medium">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Cancelar
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-6 py-10">
    <form [formGroup]="assessmentForm" (ngSubmit)="onSubmit()" class="space-y-8">
      
      <!-- Información Básica -->
      <section class="bg-white rounded-2xl shadow-md border border-gray-100 p-8 transition hover:shadow-lg">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">📘 Información Básica</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Título -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Título de la Evaluación *</label>
            <input
              type="text"
              formControlName="title"
              placeholder="Ej: Quiz 1: Introducción al Cálculo"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none placeholder-gray-400">
            <p *ngIf="assessmentForm.get('title')?.invalid && assessmentForm.get('title')?.touched"
              class="mt-1 text-sm text-red-600">El título es requerido</p>
          </div>

          <!-- Curso -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Curso *</label>
            <select
              formControlName="course_id"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
              <option value="">Selecciona un curso</option>
              <option *ngFor="let course of courses" [value]="course.id">{{ course.name }}</option>
            </select>
            <p *ngIf="assessmentForm.get('course_id')?.invalid && assessmentForm.get('course_id')?.touched"
              class="mt-1 text-sm text-red-600">Debes seleccionar un curso</p>
          </div>

          <!-- Tipo -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo de Evaluación *</label>
            <select
              formControlName="type"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="quiz">Quiz</option>
              <option value="exam">Examen</option>
              <option value="assignment">Tarea</option>
            </select>
          </div>

          <!-- Puntuación Máxima -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Puntuación Máxima</label>
            <input
              type="number"
              formControlName="max_score"
              min="1"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Fecha Límite -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha Límite</label>
            <input
              type="datetime-local"
              formControlName="due_date"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Límite de Tiempo -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Límite de Tiempo (minutos)</label>
            <input
              type="number"
              formControlName="time_limit"
              min="1"
              placeholder="Dejar vacío para sin límite"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Intentos Permitidos -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Intentos Permitidos</label>
            <input
              type="number"
              formControlName="attempts_allowed"
              min="1"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Descripción -->
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción / Instrucciones</label>
            <textarea
              formControlName="description"
              rows="3"
              placeholder="Instrucciones para los estudiantes..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
          </div>
        </div>
      </section>

      <!-- Preguntas -->
      <section class="bg-white rounded-2xl shadow-md border border-gray-100 p-8 hover:shadow-lg transition">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-semibold text-gray-800">📝 Preguntas</h2>
          <button
            type="button"
            (click)="addQuestion()"
            class="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium shadow-sm">
            + Agregar Pregunta
          </button>
        </div>

        <div formArrayName="questions" class="space-y-6">
          <div
            *ngFor="let question of questions.controls; let i = index"
            [formGroupName]="i"
            class="border border-gray-200 rounded-xl p-6 bg-gray-50 relative hover:bg-gray-100 transition">
            
            <!-- Botón eliminar -->
            <button
              type="button"
              (click)="removeQuestion(i)"
              class="absolute top-4 right-4 text-red-600 hover:text-red-700 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>

            <h3 class="text-lg font-bold text-gray-800 mb-4">Pregunta {{ i + 1 }}</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
              <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo de Pregunta</label>
                <select
                  formControlName="question_type"
                  (change)="onQuestionTypeChange(i)"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                  <option value="multiple_choice">Selección Múltiple</option>
                  <option value="true_false">Verdadero/Falso</option>
                  <option value="short_answer">Respuesta Corta</option>
                  <option value="essay">Ensayo</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Puntos</label>
                <input
                  type="number"
                  formControlName="points"
                  min="1"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-semibold text-gray-700 mb-2">Texto de la Pregunta *</label>
              <textarea
                formControlName="question_text"
                rows="2"
                placeholder="Escribe tu pregunta aquí..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
            </div>

            <div *ngIf="getQuestionType(i) === 'multiple_choice'" class="mb-4">
              <label class="block text-sm font-semibold text-gray-700 mb-2">Opciones (una por línea)</label>
              <textarea
                formControlName="options_text"
                rows="4"
                placeholder="Opción 1&#10;Opción 2&#10;Opción 3"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm resize-none"></textarea>
              <p class="text-xs text-gray-500 mt-1">Escribe cada opción en una línea nueva</p>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Respuesta Correcta *</label>
              <input
                type="text"
                formControlName="correct_answer"
                placeholder="Respuesta correcta"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </div>

        <p *ngIf="questions.length === 0" class="text-center text-gray-500 py-8">No hay preguntas aún.</p>
      </section>

      <!-- Acciones -->
      <div class="flex justify-end gap-4">
        <button
          type="button"
          routerLink="/dashboard/docente"
          [disabled]="loading"
          class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium">
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="loading || assessmentForm.invalid || questions.length === 0"
          class="flex items-center justify-center gap-2 bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <svg *ngIf="loading" class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span *ngIf="!loading">Crear Evaluación</span>
          <span *ngIf="loading">Creando...</span>
        </button>
      </div>
    </form>
  </main>
</div>
