<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Crear Nuevo Curso</h1>
          <p class="text-gray-600">Completa la información del curso</p>
        </div>
        <button
          routerLink="/dashboard/docente"
          class="px-4 py-2 text-gray-600 hover:bg-gray-50 border border-gray-300 rounded-lg transition">
          Cancelar
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">

      <!-- Información Básica -->
      <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Información Básica</h2>

        <div class="space-y-6">
          <!-- Nombre del Curso -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Curso *</label>
            <input
              type="text"
              formControlName="name"
              placeholder="Ej: Matemáticas Avanzadas"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            <p *ngIf="courseForm.get('name')?.invalid && courseForm.get('name')?.touched"
               class="mt-1 text-sm text-red-600">
              El nombre del curso es requerido
            </p>
          </div>

          <!-- Descripción -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Descripción del Curso *</label>
            <textarea
              formControlName="description"
              rows="4"
              placeholder="Describe de qué trata el curso, qué aprenderán los estudiantes..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none">
            </textarea>
            <p *ngIf="courseForm.get('description')?.invalid && courseForm.get('description')?.touched"
               class="mt-1 text-sm text-red-600">
              La descripción es requerida
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Categoría -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Categoría *</label>
              <select
                formControlName="category"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                <option value="">Selecciona una categoría</option>
                <option value="Matemáticas">Matemáticas</option>
                <option value="Programación">Programación</option>
                <option value="Ciencias">Ciencias</option>
                <option value="Idiomas">Idiomas</option>
                <option value="Historia">Historia</option>
                <option value="Arte">Arte</option>
                <option value="Negocios">Negocios</option>
                <option value="Otro">Otro</option>
              </select>
            </div>

            <!-- Nivel -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nivel *</label>
              <select
                formControlName="level"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                <option value="Básico">Básico</option>
                <option value="Intermedio">Intermedio</option>
                <option value="Avanzado">Avanzado</option>
              </select>
            </div>

            <!-- Duración -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Duración</label>
              <select
                formControlName="duration"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                <option value="">Selecciona la duración</option>
                <option value="4 semanas">4 semanas</option>
                <option value="8 semanas">8 semanas</option>
                <option value="12 semanas">12 semanas</option>
                <option value="16 semanas">16 semanas</option>
                <option value="20 semanas">20 semanas</option>
              </select>
            </div>

            <!-- ✅ Horario dinámico -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Horario *</label>

              <!-- Días -->
              <div class="flex flex-wrap gap-2 mb-4">
                <label *ngFor="let day of daysOfWeek" class="flex items-center space-x-2">
                  <input
                    type="checkbox"
                    [value]="day.value"
                    (change)="onDayChange($event)"
                    class="rounded text-blue-600 focus:ring-blue-500">
                  <span class="text-sm text-gray-700">{{ day.name }}</span>
                </label>
              </div>

              <!-- Hora inicio y fin -->
              <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                  <label class="block text-sm text-gray-700 mb-1">Hora de inicio</label>
                  <input
                    type="time"
                    formControlName="start_time"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                  <label class="block text-sm text-gray-700 mb-1">Hora de fin</label>
                  <input
                    type="time"
                    formControlName="end_time"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
              </div>

              <!-- Vista previa -->
              <div *ngIf="getFormattedSchedule()" class="bg-blue-50 border border-blue-200 text-blue-800 p-2 rounded-md text-sm">
                <strong>Horario seleccionado:</strong>
                <span>{{ getFormattedSchedule() }}</span>
              </div>
            </div>

            <!-- Fecha de Inicio -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Inicio</label>
              <input
                type="date"
                formControlName="start_date"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            </div>

            <!-- Fecha de Fin -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Fin</label>
              <input
                type="date"
                formControlName="end_date"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
            </div>
          </div>
        </div>
      </div>

      <!-- Mensajes -->
      <div *ngIf="successMessage" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6 text-green-700">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 text-red-700">
        {{ errorMessage }}
      </div>

      <!-- Botones -->
      <div class="flex gap-4">
        <button
          type="submit"
          [disabled]="loading || courseForm.invalid"
          class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition font-semibold flex items-center justify-center gap-2">
          <svg *ngIf="loading" class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span *ngIf="!loading">Crear Curso</span>
          <span *ngIf="loading">Creando...</span>
        </button>

        <button
          type="button"
          routerLink="/dashboard/docente"
          [disabled]="loading"
          class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-semibold">
          Cancelar
        </button>
      </div>
    </form>
  </main>
</div>
