<div class="min-h-screen bg-gray-50">
      <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
          <div class="flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-gray-900">Crear Nueva Lección</h1>
              <p class="text-gray-600">Agrega contenido a tu curso</p>
            </div>
            <button 
              [routerLink]="['/cursos', courseId]"
              class="px-4 py-2 text-gray-600 hover:bg-gray-50 border border-gray-300 rounded-lg transition">
              Volver al Curso
            </button>
          </div>
        </div>
      </header>

      <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <form [formGroup]="lessonForm" (ngSubmit)="onSubmit()">
          
          <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-900 mb-6">Información de la Lección</h2>
            
            <div class="space-y-6">
              <!-- Título -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  Título de la Lección *
                </label>
                <input
                  type="text"
                  formControlName="title"
                  placeholder="Ej: Introducción al Cálculo"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
              </div>

              <!-- Descripción -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  Descripción Breve
                </label>
                <textarea
                  formControlName="description"
                  rows="2"
                  placeholder="Breve descripción de lo que aprenderán..."
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none">
                </textarea>
              </div>

              <!-- Contenido (Editor Rico) -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  Contenido de la Lección *
                </label>
                <div class="border border-gray-300 rounded-lg overflow-hidden">
                  <!-- Toolbar simple -->
                  <div class="bg-gray-50 border-b border-gray-300 p-2 flex gap-2">
                    <button type="button" class="px-3 py-1 hover:bg-gray-200 rounded text-sm" title="Negrita">
                      <strong>B</strong>
                    </button>
                    <button type="button" class="px-3 py-1 hover:bg-gray-200 rounded text-sm" title="Cursiva">
                      <em>I</em>
                    </button>
                    <button type="button" class="px-3 py-1 hover:bg-gray-200 rounded text-sm" title="Subrayado">
                      <u>U</u>
                    </button>
                  </div>
                  <textarea
                    formControlName="content"
                    rows="10"
                    placeholder="Escribe el contenido de la lección aquí. Puedes usar HTML básico..."
                    class="w-full px-4 py-3 border-0 focus:ring-0 outline-none resize-none font-mono text-sm">
                  </textarea>
                </div>
                <p class="text-xs text-gray-500 mt-1">
                  Puedes usar HTML: &lt;h2&gt;, &lt;p&gt;, &lt;strong&gt;, &lt;ul&gt;, &lt;li&gt;, etc.
                </p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Orden -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">
                    Orden
                  </label>
                  <input
                    type="number"
                    formControlName="order_num"
                    min="0"
                    placeholder="1, 2, 3..."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Duración -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">
                    Duración (minutos)
                  </label>
                  <input
                    type="number"
                    formControlName="duration"
                    min="0"
                    placeholder="45"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Video URL -->
                <div class="md:col-span-1">
                  <label class="block text-sm font-medium text-gray-700 mb-2">
                    Video URL (opcional)
                  </label>
                  <input
                    type="url"
                    formControlName="video_url"
                    placeholder="https://youtube.com/..."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
              </div>
            </div>
          </div>

          <!-- Mensajes -->
          <div *ngIf="successMessage" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6 text-green-700">
            {{ successMessage }}
          </div>
          
          <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 text-red-700">
            {{ errorMessage }}
          </div>

          <!-- Botones -->
          <div class="flex gap-4">
            <button
              type="submit"
              [disabled]="loading || lessonForm.invalid"
              class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 disabled:opacity-50 transition font-semibold">
              <span *ngIf="!loading">Crear Lección</span>
              <span *ngIf="loading">Creando...</span>
            </button>
            
            <button
              type="button"
              [routerLink]="['/cursos', courseId]"
              class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition font-semibold">
              Cancelar
            </button>
          </div>

        </form>
      </main>
    </div>
