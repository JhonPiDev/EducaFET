<div class="min-h-screen bg-gray-50">
      <div *ngIf="loading" class="flex items-center justify-center min-h-screen">
        <div class="text-center">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
          <p class="mt-4 text-gray-600">Cargando lección...</p>
        </div>
      </div>

      <div *ngIf="!loading && lesson">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
              <div class="flex-1">
                <h1 class="text-2xl font-bold text-gray-900">{{ lesson.title }}</h1>
                <p class="text-gray-600 text-sm">{{ lesson.description }}</p>
              </div>
              <div class="flex items-center gap-4">
                <span class="text-sm text-gray-600">
                  <svg class="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  {{ lesson.duration }} min
                </span>
                <button 
                  [routerLink]="['/cursos', lesson.course_id]"
                  class="px-4 py-2 text-gray-600 hover:bg-gray-50 border border-gray-300 rounded-lg transition">
                  Volver al Curso
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          
          <!-- Video (si existe) -->
          <div *ngIf="lesson.video_url" class="bg-black rounded-lg overflow-hidden mb-8">
            <div class="aspect-video flex items-center justify-center">
              <p class="text-white">Video: {{ lesson.video_url }}</p>
              <!-- Aquí puedes integrar un reproductor de video real -->
            </div>
          </div>

          <!-- Contenido -->
          <div class="bg-white rounded-lg shadow-sm p-8">
            <div class="prose max-w-none" [innerHTML]="getSafeHtml(lesson.content)"></div>
          </div>

          <!-- Botón Completar (Solo Estudiantes) -->
          <div *ngIf="isStudent && !lesson.completed" class="mt-8">
            <button
              (click)="completeLesson()"
              [disabled]="completing"
              class="w-full bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700 disabled:opacity-50 transition font-semibold flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span *ngIf="!completing">Marcar como Completada</span>
              <span *ngIf="completing">Guardando...</span>
            </button>
          </div>

          <div *ngIf="lesson.completed" class="mt-8 bg-green-50 border border-green-200 rounded-lg p-4 text-green-700 text-center">
            <svg class="w-6 h-6 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Lección completada el {{ lesson.completed_at | date:'short' }}
          </div>

        </main>
      </div>
    </div>
